name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest
      - run: ACCELERATE_USE_CPU=true python -m pytest tests/unit tests/integration/test_smoke.py
      - run: bash examples/quickstart.sh /tmp/perseus-quickstart
